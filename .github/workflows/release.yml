name: Release

on:
  push:
    tags: ["v*"]
  # Escape hatch: publish whatever is on the default branch without tagging.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required both for npm provenance and for trusted publishing (OIDC):
      # GitHub mints the token npm exchanges with the registry.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The publish runs through npm, not pnpm: pnpm cannot do OIDC trusted
      # publishing yet (pnpm/pnpm#9812). The registry OIDC exchange needs
      # npm >= 11.5.1, and the npm shipped with Node 22 predates it — so assert
      # the version instead of trusting that the global install landed in PATH.
      # Provenance signing works on far older npm, which is why a signed
      # attestation in the log is no evidence that authentication was attempted.
      - name: Install an npm that can authenticate via OIDC
        run: |
          npm install --global npm@^12
          version="$(npm --version)"
          echo "npm $version at $(which npm), registry $(npm config get registry)"
          node --eval '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const supported =
              major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!supported) {
              console.error(
                `npm ${process.argv[1]} cannot authenticate via OIDC: trusted publishing needs >= 11.5.1`,
              );
              process.exit(1);
            }
          ' "$version"

      # npm needs the registry configured to attempt the OIDC exchange — without
      # any .npmrc it reports ENEEDAUTH without trying. But `setup-node`'s
      # `registry-url` also writes `_authToken=${NODE_AUTH_TOKEN}`, and with no
      # token in the environment that leaves an *empty* credential configured,
      # which npm appears to send instead of exchanging the OIDC token (the
      # registry then answers 404 on the PUT). So write the registry line and
      # nothing else.
      - name: Point npm at the registry, with no credential configured
        run: |
          echo "registry=https://registry.npmjs.org/" > "$HOME/.npmrc"
          cat "$HOME/.npmrc"

      - run: pnpm install --frozen-lockfile

      - run: pnpm check-types

      - run: pnpm test

      # A tag must publish exactly the version in package.json — otherwise the
      # tag and the registry disagree forever.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(node -p "require('./package.json').version")"
          if [ "$tagged" != "$declared" ]; then
            echo "tag v$tagged does not match package.json version $declared" >&2
            exit 1
          fi

      # No token: the package has a trusted publisher configured for this
      # repository and this workflow, so npm authenticates with the OIDC token
      # minted by `id-token: write` above.
      #
      # `--provenance` lives here rather than in publishConfig because it is a
      # CI-only capability: in publishConfig it would break publishing by hand.
      # Verbose so the log shows whether npm requests an OIDC token exchange at
      # all (`POST /-/npm/v1/oidc/token/exchange`). If that request is missing,
      # the problem is on this side; if it is rejected, it is the trusted
      # publisher configuration on the package.
      - run: npm publish --provenance --loglevel verbose
