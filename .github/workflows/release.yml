name: Release

on:
  push:
    tags: ["v*"]
  # Escape hatch: publish whatever is on the default branch without tagging.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required both for npm provenance and for trusted publishing (OIDC):
      # GitHub mints the token npm exchanges with the registry.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      # `registry-url` is required even with trusted publishing: it writes the
      # .npmrc that points npm at the registry, and without it npm never attempts
      # the OIDC exchange — it just reports ENEEDAUTH. The `_authToken` line it
      # leaves behind resolves to nothing, which is expected and harmless.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # The publish runs through npm, not pnpm: pnpm cannot do OIDC trusted
      # publishing yet (pnpm/pnpm#9812), and the npm shipped with Node 22 predates
      # OIDC support.
      - run: npm install --global npm@^12

      - run: pnpm install --frozen-lockfile

      - run: pnpm check-types

      - run: pnpm test

      # A tag must publish exactly the version in package.json — otherwise the
      # tag and the registry disagree forever.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(node -p "require('./package.json').version")"
          if [ "$tagged" != "$declared" ]; then
            echo "tag v$tagged does not match package.json version $declared" >&2
            exit 1
          fi

      # No token: the package has a trusted publisher configured for this
      # repository and this workflow, so npm authenticates with the OIDC token
      # minted by `id-token: write` above.
      #
      # `--provenance` lives here rather than in publishConfig because it is a
      # CI-only capability: in publishConfig it would break publishing by hand.
      - run: npm publish --provenance
