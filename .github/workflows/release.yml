name: Release

# Manual only: the workflow owns the whole release — it bumps the version,
# publishes, and only then writes the commit and the tag back to the branch it
# released from.
#
# Two releases run in parallel off this one workflow:
#
#   ref=main, tag=latest   the stable line       (Effect 3)
#   ref=v4,   tag=beta     the 0.2 prerelease    (Effect 4)
#
# `tag` is not optional cosmetics: npm ignores the prerelease part of a version
# when choosing a dist-tag, so publishing 0.2.0-beta.0 without `--tag beta`
# would make it the default install for everyone.
#
# There is no npm token anywhere. The package is published through a trusted
# publisher, whose configuration on npm must match what this workflow claims:
#
#   organization  kylobyte-dev   <- the GitHub org, NOT the npm scope (@kylobyte)
#   repository    keel
#   workflow      release.yml
#   environment   (empty)
#
# npm answers `package not found` when any of those disagree, which reads as if
# the package were missing rather than as a configuration mismatch. Renaming this
# file, or adding an `environment:` to the job, means updating npm first.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "patch | minor | major | prerelease, or an explicit version like 1.2.3"
        type: string
        default: patch
        required: true
      ref:
        description: "branch to release from — the release commit and tag go back to it"
        type: string
        default: main
        required: true
      tag:
        description: "npm dist-tag: latest for the stable line, beta for a prerelease"
        type: string
        default: latest
        required: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Pushes the release commit and the tag.
      contents: write
      # Mints the OIDC token npm exchanges with the registry, and signs provenance.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The publish goes through npm, not pnpm: pnpm cannot do OIDC trusted
      # publishing yet (pnpm/pnpm#9812). The exchange needs npm >= 11.5.1, which
      # is newer than the npm bundled with Node 22 — assert it, so a change here
      # fails loudly instead of failing as an authentication error.
      - name: Install an npm that can authenticate via OIDC
        run: |
          npm install --global npm@^12
          version="$(npm --version)"
          echo "npm $version at $(which npm)"
          node --eval '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const supported =
              major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!supported) {
              console.error(
                `npm ${process.argv[1]} cannot authenticate via OIDC: trusted publishing needs >= 11.5.1`,
              );
              process.exit(1);
            }
          ' "$version"

      # npm needs a configured registry to attempt the OIDC exchange, and no
      # credential of any kind: the trusted publisher is the only way in.
      - name: Point npm at the registry
        run: echo "registry=https://registry.npmjs.org/" > "$HOME/.npmrc"

      - run: pnpm install --frozen-lockfile

      - run: pnpm check-types

      - run: pnpm test

      # `npm version` derives the number from package.json, then commits and
      # tags — locally. Nothing is pushed until the publish succeeds.
      - name: Bump the version
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "${{ inputs.bump }}" --message "chore: release v%s"
          echo "released=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # The one mistake that cannot be undone by releasing again: a prerelease
      # landing on `latest` silently becomes what everyone installs, and moving
      # a dist-tag back does not un-install it from the lockfiles that caught it.
      # Checked after the bump, because `bump` may be a keyword rather than the
      # literal version.
      - name: Refuse to publish a prerelease as latest
        run: |
          version="${{ steps.bump.outputs.released }}"
          tag="${{ inputs.tag }}"
          if [[ "$version" == *-* && "$tag" == "latest" ]]; then
            echo "::error::$version is a prerelease; publishing it as 'latest' would make it the default install. Re-run with tag=beta."
            exit 1
          fi
          if [[ "$version" != *-* && "$tag" != "latest" ]]; then
            echo "::warning::$version is a stable version being published under the '$tag' tag; 'latest' will keep pointing at the previous release."
          fi

      - run: npm publish --provenance --tag "${{ inputs.tag }}"

      # Last, so a rejected publish leaves the branch exactly as it was. If this
      # step is the one that fails, the version is already published and
      # immutable: push the release commit and its tag by hand rather than
      # releasing again.
      - name: Push the release commit and its tag
        run: git push --follow-tags origin "HEAD:${{ inputs.ref }}"

      - name: Summary
        run: |
          echo "Published \`@kylobyte/keel@${{ steps.bump.outputs.released }}\` from \`${{ inputs.ref }}\` under the \`${{ inputs.tag }}\` tag" >> "$GITHUB_STEP_SUMMARY"
          echo "https://www.npmjs.com/package/@kylobyte/keel/v/${{ steps.bump.outputs.released }}" >> "$GITHUB_STEP_SUMMARY"
