name: Release

# Manual only. The workflow owns the whole release: it bumps the version,
# publishes, and only then writes the commit and the tag to main — so a failed
# publish leaves the branch untouched.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "patch | minor | major | prerelease, or an explicit version like 1.2.3"
        type: string
        default: patch
        required: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Pushes the release commit and the tag.
      contents: write
      # Required both for npm provenance and for trusted publishing (OIDC):
      # GitHub mints the token npm exchanges with the registry.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The publish runs through npm, not pnpm: pnpm cannot do OIDC trusted
      # publishing yet (pnpm/pnpm#9812). The registry OIDC exchange needs
      # npm >= 11.5.1, and the npm shipped with Node 22 predates it — so assert
      # the version instead of trusting that the global install landed in PATH.
      # Provenance signing works on far older npm, which is why a signed
      # attestation in the log is no evidence that authentication was attempted.
      - name: Install an npm that can authenticate via OIDC
        run: |
          npm install --global npm@^12
          version="$(npm --version)"
          echo "npm $version at $(which npm)"
          node --eval '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const supported =
              major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!supported) {
              console.error(
                `npm ${process.argv[1]} cannot authenticate via OIDC: trusted publishing needs >= 11.5.1`,
              );
              process.exit(1);
            }
          ' "$version"

      # npm needs the registry configured to attempt the OIDC exchange — without
      # any .npmrc it reports ENEEDAUTH without trying. But `setup-node`'s
      # `registry-url` also writes `_authToken=${NODE_AUTH_TOKEN}`, and with no
      # token in the environment that leaves an *empty* credential configured,
      # which npm appears to send instead of exchanging the OIDC token (the
      # registry then answers 404 on the PUT). So write the registry line and
      # nothing else.
      - name: Point npm at the registry, with no credential configured
        run: |
          echo "registry=https://registry.npmjs.org/" > "$HOME/.npmrc"
          cat "$HOME/.npmrc"

      - run: pnpm install --frozen-lockfile

      - run: pnpm check-types

      - run: pnpm test

      # Everything that can fail cheaply has run. `npm version` computes the new
      # number from package.json — nobody types it — then commits and tags.
      # Nothing is pushed yet.
      - name: Bump the version
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "${{ inputs.bump }}" --message "chore: release v%s"
          echo "released=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - run: npm publish --provenance --loglevel verbose

      # Last, so that a rejected publish leaves main exactly as it was. If this
      # step is the one that fails, the version is already on the registry: push
      # the commit and the tag by hand rather than releasing again.
      - name: Push the release commit and its tag
        run: git push --follow-tags origin main

      - name: Summary
        run: |
          echo "Published \`@kylobyte/keel@${{ steps.bump.outputs.released }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "https://www.npmjs.com/package/@kylobyte/keel/v/${{ steps.bump.outputs.released }}" >> "$GITHUB_STEP_SUMMARY"
