name: Release

on:
  push:
    tags: ["v*"]
  # Escape hatch: publish whatever is on the default branch without tagging.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required both for npm provenance and for trusted publishing (OIDC):
      # GitHub mints the token npm exchanges with the registry.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # The publish runs through npm, not pnpm: pnpm cannot do OIDC trusted
      # publishing yet (pnpm/pnpm#9812), and the npm shipped with Node 22 is too
      # old for it. Installing a current npm keeps the switch away from
      # NPM_TOKEN a settings-only change, with no edit to this workflow.
      - run: npm install --global npm@^12

      - run: pnpm install --frozen-lockfile

      - run: pnpm check-types

      - run: pnpm test

      # A tag must publish exactly the version in package.json — otherwise the
      # tag and the registry disagree forever.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(node -p "require('./package.json').version")"
          if [ "$tagged" != "$declared" ]; then
            echo "tag v$tagged does not match package.json version $declared" >&2
            exit 1
          fi

      # `--provenance` lives here rather than in publishConfig: it is a CI-only
      # capability, and in publishConfig it would break publishing by hand.
      # NODE_AUTH_TOKEN is only needed until a trusted publisher is configured
      # for the package: after that, delete the secret and OIDC takes over.
      - run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
