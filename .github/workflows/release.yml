name: Release

# Manual only: the workflow owns the whole release — it bumps the version,
# publishes, and only then writes the commit and the tag back to the branch it
# released from.
#
# The branch is the one picked in the "Run workflow" dropdown: it is what gets
# checked out, and what the release commit and tag are pushed back to. That also
# means the workflow file that runs is the one on that branch, so the two lines
# can diverge without surprising each other.
#
# Two releases run in parallel off this one workflow:
#
#   branch main, tag latest   the stable line
#   branch v4,   tag beta     the 0.2 prerelease
#
# Every input is a fixed list, and `tag` carries two jobs: it is the npm
# dist-tag, and for a pre* bump it is also the prerelease identifier. So `beta`
# means 0.2.0-beta.N published under `beta`, and the two can never disagree.
#
# `tag` is not optional cosmetics: npm ignores the prerelease part of a version
# when choosing a dist-tag, so publishing 0.2.0-beta.0 without `--tag beta`
# would make it the default install for everyone.
#
# There is no npm token anywhere. The package is published through a trusted
# publisher, whose configuration on npm must match what this workflow claims:
#
#   organization  kylobyte-dev   <- the GitHub org, NOT the npm scope (@kylobyte)
#   repository    keel
#   workflow      release.yml
#   environment   (empty)
#
# npm answers `package not found` when any of those disagree, which reads as if
# the package were missing rather than as a configuration mismatch. Renaming this
# file, or adding an `environment:` to the job, means updating npm first.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "How to move the version"
        type: choice
        default: patch
        required: true
        options:
          - patch
          - minor
          - major
          - prerelease
          - prepatch
          - preminor
          - premajor
      tag:
        description: "npm dist-tag — also the prerelease identifier for the pre* bumps"
        type: choice
        default: latest
        required: true
        options:
          - latest
          - beta
          - rc

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Pushes the release commit and the tag.
      contents: write
      # Mints the OIDC token npm exchanges with the registry, and signs provenance.
      id-token: write
    steps:
      # No `ref:` — the default is the branch picked in the dropdown, which is
      # exactly what this release is for.
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The publish goes through npm, not pnpm: pnpm cannot do OIDC trusted
      # publishing yet (pnpm/pnpm#9812). The exchange needs npm >= 11.5.1, which
      # is newer than the npm bundled with Node 22 — assert it, so a change here
      # fails loudly instead of failing as an authentication error.
      - name: Install an npm that can authenticate via OIDC
        run: |
          npm install --global npm@^12
          version="$(npm --version)"
          echo "npm $version at $(which npm)"
          node --eval '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const supported =
              major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!supported) {
              console.error(
                `npm ${process.argv[1]} cannot authenticate via OIDC: trusted publishing needs >= 11.5.1`,
              );
              process.exit(1);
            }
          ' "$version"

      # npm needs a configured registry to attempt the OIDC exchange, and no
      # credential of any kind: the trusted publisher is the only way in.
      - name: Point npm at the registry
        run: echo "registry=https://registry.npmjs.org/" > "$HOME/.npmrc"

      # A pre* bump always produces a prerelease, so pairing one with `latest` is
      # wrong whatever the numbers turn out to be. Caught here, before anything
      # runs, rather than after the bump has already invented a version.
      - name: Reject a prerelease bump aimed at latest
        if: startsWith(inputs.bump, 'pre') && inputs.tag == 'latest'
        run: |
          echo "::error::A '${{ inputs.bump }}' bump produces a prerelease, which cannot go to 'latest' — it would become the default install. Pick tag=beta or tag=rc."
          exit 1

      - run: pnpm install --frozen-lockfile

      - run: pnpm check-types

      - run: pnpm test

      # `npm version` derives the number from package.json, then commits and
      # tags — locally. Nothing is pushed until the publish succeeds.
      - name: Bump the version
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "${{ inputs.bump }}" --preid "${{ inputs.tag }}" --message "chore: release v%s"
          echo "released=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Belt and braces: the step above rules this out from the inputs, but that
      # relies on `pre*` always yielding a prerelease. This one checks the version
      # npm actually produced, because a prerelease landing on `latest` silently
      # becomes what everyone installs, and moving a dist-tag back does not
      # un-install it from the lockfiles that caught it.
      - name: Refuse to publish a prerelease as latest
        run: |
          version="${{ steps.bump.outputs.released }}"
          tag="${{ inputs.tag }}"
          if [[ "$version" == *-* && "$tag" == "latest" ]]; then
            echo "::error::npm produced $version, a prerelease, for tag 'latest'. Publishing it would make it the default install. Re-run with tag=beta or tag=rc."
            exit 1
          fi
          if [[ "$version" != *-* && "$tag" != "latest" ]]; then
            echo "::warning::$version is a stable version being published under the '$tag' tag; 'latest' will keep pointing at the previous release."
          fi

      - run: npm publish --provenance --tag "${{ inputs.tag }}"

      # Last, so a rejected publish leaves the branch exactly as it was. If this
      # step is the one that fails, the version is already published and
      # immutable: push the release commit and its tag by hand rather than
      # releasing again.
      - name: Push the release commit and its tag
        run: git push --follow-tags origin "HEAD:${{ github.ref_name }}"

      - name: Summary
        run: |
          echo "Published \`@kylobyte/keel@${{ steps.bump.outputs.released }}\` from \`${{ github.ref_name }}\` under the \`${{ inputs.tag }}\` tag" >> "$GITHUB_STEP_SUMMARY"
          echo "https://www.npmjs.com/package/@kylobyte/keel/v/${{ steps.bump.outputs.released }}" >> "$GITHUB_STEP_SUMMARY"
